# Real DNS domain + automatic TLS:
# docker compose -f compose.yaml -f compose.https.yaml --profile full --profile https up -d --build
services:
  gateway:
    profiles: ["https"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set your DNS domain in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    depends_on:
      app: {condition: service_healthy}
volumes:
  caddy-data:
  caddy-config:
