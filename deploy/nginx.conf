worker_processes auto;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  map $request_method $mutation_limit_key {
        default "";
        POST $binary_remote_addr;
        PATCH $binary_remote_addr;
        DELETE $binary_remote_addr;
    }
    limit_req_zone $mutation_limit_key zone=mutations_v3:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=reads_v3:10m rate=20r/s;
  log_format compact '$remote_addr $request_method $uri $status';
  access_log /var/log/nginx/access.log compact;
  server {
    listen 80;
    client_max_body_size 6m;
    add_header X-Frame-Options SAMEORIGIN always;
    location /api/tasks {
      limit_req zone=mutations_v3 burst=20 nodelay;
            limit_req zone=reads_v3 burst=40 nodelay;
            limit_req_status 429;
      proxy_pass http://app:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 650s;
    }
    location / {
      proxy_pass http://app:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 650s;
    }
  }
}
